# Gradle 构建内存与配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 固定 Gradle 守护进程 JVM 为 JDK 21（Gradle 8.10.2 最高支持 JVM 23；
# Android Studio 自带 JBR 25 不兼容，此处强制用本机 Temurin 21。
# 仅本机生效；换机器时删除此行并在 AS 里选 ≤23 的 JDK 即可）
org.gradle.java.home=C:/Users/XPS/.jdks/jdk-21.0.12+8
# AndroidX（必须开启）
android.useAndroidX=true
# 非传递 R 类（构建更快）
android.nonTransitiveRClass=true
# 新工程先关配置缓存，避免未知插件兼容问题
org.gradle.configuration-cache=false
