<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>TudouniTV 播放器</title>

    <!-- Favicon -->
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script src="libs/tailwindcss.min.js?v=3"></script>
    <script src="js/core/version-check.js?v=3"></script>
    <script>
        // goBack 兜底：player.js 正常加载时其定义会覆盖本兜底；
        // 若 player.js 执行失败（如 localStorage 异常），返回按钮也不报错
        window.goBack = window.goBack || function (e) {
            if (e) e.preventDefault();
            try {
                var u = new URLSearchParams(window.location.search).get('returnUrl');
                if (u) { window.location.href = decodeURIComponent(u); return; }
            } catch (err) {}
            window.history.back();
        };
    </script>
    <link rel="stylesheet" href="css/styles.css?v=3">
    <link rel="stylesheet" href="css/player.css?v=3">
    <link rel="stylesheet" href="css/design.css?v=9">

    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="page-bg">

    <!-- ==================== 顶部导航 ==================== -->
    <header class="topbar">
        <button id="homeButton" type="button" class="brand" aria-label="返回首页" title="返回首页">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm3-8.5-4.5-2.6a.8.8 0 0 0-1.2.7v5.8a.8.8 0 0 0 1.2.7l4.5-2.6a.8.8 0 0 0 0-1.4z"/></svg>
            </div>
            <div class="brand-name">Tudouni<em>TV</em></div>
        </button>
        <nav class="nav-links" id="navLinks">
            <a class="nav-link" href="/">首页</a>
            <a class="nav-link" href="/?cat=movie">电影</a>
            <a class="nav-link" href="/?cat=series">剧集</a>
            <a class="nav-link" href="/?cat=anime">动漫</a>
            <a class="nav-link" href="/?cat=variety">综艺</a>
            <a class="nav-link" href="/?cat=history">历史记录</a>
        </nav>
        <h2 id="videoTitle" class="watch-title" style="flex:1;text-align:center;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px"></h2>
        <div class="search-wrap" style="flex-shrink:0;max-width:293px">
            <div class="search" style="height:34px">
                <input id="playerSearchInput" type="text" placeholder="搜索…" aria-label="搜索"
                       autocomplete="off" style="height:100%"
                       onkeydown="if(event.key==='Enter'){window.playerSearch && playerSearch(this)}">
            </div>
        </div>
        <button id="goBack" onclick="goBack(event)" class="ep-nav-btn" style="flex-shrink:0" aria-label="返回上一页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            上一页
        </button>
    </header>

    <!-- 登录 / 注册弹窗 -->
    <div id="passwordModal" class="modal-overlay hidden" aria-label="登录" aria-hidden="true">
        <div class="modal-box sm">
            <div class="modal-head">
                <h2 class="modal-title">TudouniTV</h2>
            </div>
            <div class="auth-tabs" style="display:flex;gap:8px;margin-bottom:16px">
                <button type="button" id="authTabLogin" class="auth-tab active" onclick="switchAuthTab('login')" style="flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent">登录</button>
                <button type="button" id="authTabRegister" class="auth-tab" onclick="switchAuthTab('register')" style="flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent">注册</button>
            </div>
            <p id="authDesc" style="color:var(--text-2);font-size:14px;margin-bottom:14px">登录后同步你的观看记录</p>
            <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                <input type="text" id="authUsername" class="form-input" placeholder="用户名（2-32位字母/数字/下划线/中文）" autocomplete="username" aria-label="用户名" style="margin-bottom:10px">
                <input type="password" id="passwordInput" class="form-input" placeholder="密码（至少6位）" autocomplete="new-password" aria-label="密码">
                <button id="passwordSubmitBtn" type="submit" class="act-btn primary" style="width:100%;justify-content:center;margin-top:14px">登录</button>
            </form>
            <p id="passwordError" class="form-error hidden">密码错误，请重试</p>
        </div>
    </div>

    <main class="main">
        <div class="watch-layout">
            <!-- ===== 左侧：播放器 + 信息 + 选集 + 短评 ===== -->
            <div>
                <!-- 播放器 -->
                <div class="player-shell player-container" id="playerContainer">
                    <div id="player" class="player-placeholder">
                        <!-- 初始加载状态 -->
                        <div class="player-loading-overlay">
                            <div class="player-loading-spinner"></div>
                            <div class="player-loading-text" id="loading-title">正在加载视频...</div>
                        </div>
                    </div>
                    <div class="loading-container" id="player-loading" style="display: none;">
                        <div class="loading-spinner"></div>
                        <div>正在加载视频...</div>
                    </div>
                    <div class="error-container" id="error" style="display: none;">
                        <div class="error-icon">⚠️</div>
                        <div id="error-message">视频加载失败</div>
                        <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                    </div>
                </div>

                <!-- 片名信息区 -->
                <div class="watch-info">
                    <h1 class="watch-title" id="watchTitle" style="font-size:23px">加载中...</h1>
                    <div class="watch-tags" id="watchTags"></div>
                    <div class="watch-desc" id="watchDesc" style="display:none"></div>
                    <div class="act-row">
                        <button class="act-btn primary" id="btnPlayCurrent" style="display:none">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
                            <span>刷新播放</span>
                        </button>
                        <button class="act-btn" onclick="showSwitchResourceModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
                            切换资源
                        </button>
                        <button class="act-btn" onclick="copyLinks()" title="复制播放链接">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            复制链接
                        </button>
                        <button class="act-btn" id="lockToggle" onclick="toggleControlsLock()" title="锁定控制">
                            <svg id="lockIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px"><path d="M15 11V7a3 3 0 0 0-6 0v4m-3 4h12v6H6v-6z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 源信息（player.js 动态渲染） -->
                <div id="resourceInfoBarContainer" class="ep-nav-row"></div>
            </div>

            <!-- ===== 右侧：选集 + 猜你喜欢 ===== -->
            <div class="watch-side">
                <!-- 选集区 -->
                <div class="episodes">
                    <div class="ep-head">
                        <h3>选集</h3>
                        <span id="episodeInfo">加载中...</span>
                        <div class="ep-tools">
                            <label>
                                <span>自动连播</span>
                                <span class="switch" style="width:36px;height:20px">
                                    <input type="checkbox" id="autoplayToggle">
                                    <span class="slider"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="ep-nav-row">
                        <button id="prevButton" class="ep-nav-btn" onclick="playPreviousEpisode()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                            上一集
                        </button>
                        <span class="ep-nav-info"></span>
                        <button id="nextButton" class="ep-nav-btn" onclick="playNextEpisode()">
                            下一集
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                    <div class="ep-grid" id="episodesList">
                        <div class="ep-loading" style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:26px 0">加载中...</div>
                    </div>
                </div>

                <!-- 猜你喜欢 -->
                <aside class="related">
                    <div class="related-title">猜你喜欢</div>
                    <div id="relatedList">
                        <div class="rel-loading" style="color:var(--text-3);font-size:13px;padding:20px 0">加载中...</div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- 快捷键提示 -->
    <div class="shortcut-hint" id="shortcutHint" style="display:none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon" style="width:22px;height:22px">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-inner">
            <div>
                <div class="footer-brand">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>TudouniTV</span>
                </div>
                <p class="copy">© 2025 TudouniTV - 自由观影，畅享精彩</p>
            </div>
            <div>
                <p class="disclaimer">免责声明：本站仅为视频搜索工具，不存储、上传或分发任何视频内容。所有视频均来自第三方API接口。如有侵权，请联系相关内容提供方。</p>
                <div class="links">
                    <a href="about.html">关于我们</a>
                    <a href="about.html">隐私政策</a>
                    <a href="https://www.msf.hk/zh-hant/donate/general?type=one-off" target="_blank" rel="noopener">捐赠</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- 换源/详情 弹窗（player.js 复用） -->
    <div id="modal" class="modal-overlay hidden" aria-label="视频详情" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="modalTitle" class="modal-title"></h2>
                <button onclick="closeModal()" class="close-btn modal-close" aria-label="关闭">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Loading 遮罩 -->
    <div id="loading" aria-hidden="true">
        <div class="loading-box">
            <div class="spin"></div>
            <p>加载中...</p>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="hidden" aria-live="polite"><p id="toastMessage"></p></div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js?v=3"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>

    <script src="libs/hls.min.js?v=3" crossorigin="anonymous"></script>
    <script src="libs/artplayer.min.js?v=3" crossorigin="anonymous"></script>

    <script src="js/core/config.js?v=4"></script>
    <script src="js/core/proxy-auth.js?v=3"></script>
    <script src="js/core/customer_site.js?v=3"></script>
    <script src="js/core/password.js?v=3"></script>
    <script src="js/core/ui.js?v=3"></script>
    <script src="js/core/api.js?v=3"></script>
    <script src="js/core/search.js?v=3"></script>
    <script src="js/pages/player.js?v=6"></script>
    <script src="js/pages/player-page.js?v=3"></script>

    <script>
        // 修复 home 跳转（播放器统一为整页跳转，不再有 iframe 场景）
        document.addEventListener('DOMContentLoaded', function() {
            // 导航链接：直接整页跳转
            document.querySelectorAll('.nav-link').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = link.getAttribute('href') || '/';
                });
            });
            // 搜索框：整页跳转
            window.playerSearch = function (input) {
                var v = input.value.trim();
                if (!v) return;
                window.location.href = '/s=' + encodeURIComponent(v);
            };

            // 使用事件委托处理首页按钮点击
            document.body.addEventListener('click', function(event) {
                const homeButton = event.target.closest('#homeButton');
                if (homeButton) {
                    event.preventDefault();
                    event.stopPropagation();

                    // 多重兜底跳转
                    try {
                            window.location.href = '/';
                    } catch (e) {
                        try {
                            window.location.replace('/');
                        } catch (e2) {
                            window.location.assign('/');
                    }
                    }
                    return false;
                }
            });
        });
    </script>
</body>
</html>
